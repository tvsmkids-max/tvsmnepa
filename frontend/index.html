<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/logo.png" type="image/png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="TVSM School — Attendance Management System"
    />
    <meta name="author" content="Abhishek Wani" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="TVSM School" />
    <meta name="application-name" content="TVSM School" />

    <!-- Open Graph -->
    <meta property="og:title" content="TVSM School" />
    <meta property="og:description" content="Attendance Management System" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.png" />

    <!-- 🌟 NEW: Premium SaaS Font (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <title>TVSM - Attendance Management</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: #f8fafc; /* Modern slate-50 background */
        font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #root-loader {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #f8fafc;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }

      #root-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }

      @supports (padding: max(0px)) {
        body {
          padding-left: env(safe-area-inset-left);
          padding-right: env(safe-area-inset-right);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="root-loader">
      <img
        src="/loader.svg"
        alt=""
        width="90"
        height="90"
        style="object-fit: contain"
      />
    </div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      var ci = setInterval(function () {
        var r = document.getElementById("root");
        var l = document.getElementById("root-loader");
        if (r && r.children.length > 0 && l) {
          l.classList.add("hidden");
          setTimeout(function () {
            if (l.parentNode) l.parentNode.removeChild(l);
          }, 400);
          clearInterval(ci);
        }
      }, 100);
      setTimeout(function () {
        var l = document.getElementById("root-loader");
        if (l && l.parentNode) l.parentNode.removeChild(l);
        clearInterval(ci);
      }, 10000);
    </script>
  </body>
</html>
