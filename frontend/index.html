<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="School Attendance Management System" />
    <meta name="theme-color" content="#0D1B3E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Attendance" />
    <meta name="application-name" content="Attendance" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Attendance System | School</title>

    <style>
      body { margin: 0; padding: 0; background-color: #F8F9FC; }
      #root-loader {
        display: flex; align-items: center; justify-content: center;
        height: 100vh;
        background: linear-gradient(135deg, #0D1B3E 0%, #1A3A7A 100%);
        color: white; font-family: 'Inter', sans-serif;
        flex-direction: column; gap: 16px;
      }
      #root-loader .spinner {
        width: 40px; height: 40px;
        border: 3px solid rgba(255,255,255,0.2);
        border-top-color: #F5A623;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="root-loader">
        <img src="/logo.png" alt="" width="80" height="80"
          style="border-radius: 50%; background: white; padding: 10px; object-fit: contain;"
          onerror="this.style.display='none'" />
        <div class="spinner"></div>
        <div style="font-size: 14px; opacity: 0.7;">Loading...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
